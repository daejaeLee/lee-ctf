#approval_policy = "on-request"
approval_policy = "never"

#sandbox_mode = "workspace-write"
sandbox_mode = "danger-full-access"

# Project-local CTF coordinator. Child routing is governed by the concise
# orchestration policy in AGENTS.md; no global Codex settings are changed.
model = "gpt-5.6-terra"
model_reasoning_effort = "medium"

[features]
multi_agent_v2 = true

# Keep skills installed and available for explicit/on-demand use, but do not
# inject every SKILL.md description into the first model turn. AGENTS.md is
# the CTF category router for this repository.
[skills]
include_instructions = false

[agents.luna]
description = "Bounded CTF discovery: inventory, search, classification, and deterministic transformations. Report concise findings; do not make final exploitability judgments."
model = "gpt-5.6-luna"
model_reasoning_effort = "low"

[agents.terra]
description = "Normal CTF analysis and implementation: source and data-flow analysis, PoCs, solvers, debugging, and focused code changes."
model = "gpt-5.6-terra"
model_reasoning_effort = "medium"

[agents.sol]
description = "Deep CTF analysis: native crashes, assembly, decompiler recovery, obfuscated logic, protocols, and conflicting hypotheses."
model = "gpt-5.6-sol"
model_reasoning_effort = "high"

[agents.astra]
description = "Exceptional fallback after Sol has insufficient evidence for a multi-subsystem or architecture-level problem."
model = "gpt-6-astra"
model_reasoning_effort = "high"

# Project-local plugin pruning. These overrides apply whenever Codex starts
# from this repository, including a plain `codex` invocation. They do not
# modify global plugin installation or enablement state.
[plugins."claude-mem@claude-mem-local"]
enabled = true

# `daejaeLee/claude-mem` currently publishes the marketplace name
# `thedotmack`. Keep the installed local alias above for existing machines and
# this alias for a clean setup; an absent plugin entry is harmless.
[plugins."claude-mem@thedotmack"]
enabled = true

[plugins."ecc@ecc"]
enabled = false

[plugins."documents@openai-primary-runtime"]
enabled = false

[plugins."pdf@openai-primary-runtime"]
enabled = false

[plugins."spreadsheets@openai-primary-runtime"]
enabled = false

[plugins."presentations@openai-primary-runtime"]
enabled = false

[plugins."template-creator@openai-primary-runtime"]
enabled = false

[plugins."sites@openai-bundled"]
enabled = false

[plugins."computer-use@openai-bundled"]
enabled = false

[plugins."visualize@openai-bundled"]
enabled = false

[sandbox_workspace_write]
writable_roots = []
network_access = false

[windows]
sandbox = "unelevated"
