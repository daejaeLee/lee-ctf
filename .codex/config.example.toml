# Optional user-level Chrome DevTools MCP configuration for WMux.
# Merge this table into %USERPROFILE%\.codex\config.toml; do not copy the
# repository configuration over an existing user configuration.
#
# Replace C:\\path\\to\\lee-ctf with this clone's absolute path. The launcher
# starts WMux only when its loopback CDP proxy is unavailable, then preserves
# stdin/stdout for the MCP server. Pin a reviewed package version in the
# launcher if your environment requires reproducible dependency resolution.
[mcp_servers.chrome-devtools]
command = "powershell.exe"
args = [
  "-NoProfile",
  "-ExecutionPolicy", "Bypass",
  "-File", "C:\\path\\to\\lee-ctf\\scripts\\Start-WmuxChromeDevToolsMcp.ps1",
]

# Do not add --isolated or --executablePath here: either causes the MCP server
# to launch or select a separate Chrome rather than attach to WMux's CDP proxy.
